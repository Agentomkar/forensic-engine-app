name: Keep API warm
# Free Render instances sleep after ~15 min idle (first request then takes ~50 s).
# A health ping every 10 minutes keeps the demo/review experience fast, at no cost.
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://feia-api.onrender.com/api/v1/health
