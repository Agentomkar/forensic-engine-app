name: Android build (Play Store)

# Builds the FEIA Scam Check Android app on GitHub's servers.
#  - Every push to mobile/ or the backend: tests + a debug APK you can install on a phone.
#  - When the signing secrets exist: a signed release .aab ready to upload to Play Console.
# Download results from the run page -> "Artifacts".

on:
  push:
    branches: [main, android-playstore]
    paths: ['mobile/**', 'mobile_api.py', 'app.py', 'agent_core.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'mobile_api.py']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Mobile API tests
        run: PUBLIC_MODE=1 python -m pytest test_mobile_api.py -q -p no:warnings

  android:
    needs: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Play needs a higher versionCode for every upload; run_number always increases.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install JS dependencies
        run: npm ci

      - name: Offline-check unit tests
        run: npm test

      - name: Point the app at the deployed backend
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::API_BASE_URL secret not set; app will use the default in src/config.js"
          else
            case "$API_BASE_URL" in https://*) ;; *) echo "::error::API_BASE_URL must start with https://"; exit 1;; esac
            echo "export const API_BASE = '${API_BASE_URL%/}';" > src/config.js
          fi
          cat src/config.js

      - name: Build web bundle and sync into Android project
        run: |
          npm run build
          npx cap sync android

      - name: Restore upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No KEYSTORE_BASE64 secret: building debug APK only (not uploadable to Play)."
          fi

      - name: Build debug APK (install on any phone for testing)
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed release AAB
        if: steps.keystore.outputs.path != ''
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: feia-debug-apk-v${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: feia-release-aab-v${{ github.run_number }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
